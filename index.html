<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Heirloom Church Financials — Moved</title>
  <meta http-equiv="refresh" content="0; url=https://turnkeycfo.com/clients/heirloom/">
  <link rel="canonical" href="https://turnkeycfo.com/clients/heirloom/">
  <style>
    :root{ --navy-900:#082638; --mint-500:#36d58c; --slate:#698293; --ice:#edf5f9; }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
         background:radial-gradient(1100px 620px at 50% -10%,var(--ice),#f4f9fb 60%);
         color:var(--navy-900);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;}
    .box{max-width:460px;background:#fff;border:1px solid #dbe8f0;border-radius:20px;
         padding:40px 36px;box-shadow:0 22px 60px rgba(8,38,56,.12);text-align:center;}
    .bar{display:flex;height:5px;margin:0 auto 22px;width:88px;border-radius:3px;overflow:hidden;}
    .bar i{display:block;height:5px;} .bar .a{background:var(--navy-900);width:60%;} .bar .b{background:var(--mint-500);width:40%;}
    h1{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-bottom:10px;}
    p{font-size:15px;color:var(--slate);line-height:1.55;margin-bottom:22px;}
    a.btn{display:inline-block;font-weight:800;font-size:15px;color:#fff;text-decoration:none;
          background:linear-gradient(135deg,var(--navy-900),#0e3c57);border-radius:11px;padding:13px 26px;}
    a.btn:hover{filter:brightness(1.08);}
  </style>
</head>
<body>
  <main class="box">
    <div class="bar"><i class="a"></i><i class="b"></i></div>
    <h1>This dashboard has moved</h1>
    <p>Heirloom Church financials now live on a secure, passcode-protected page at turnkeycfo.com. You will be redirected automatically.</p>
    <a class="btn" href="https://turnkeycfo.com/clients/heirloom/">Go to the secure dashboard</a>
  </main>
  <script>window.location.replace("https://turnkeycfo.com/clients/heirloom/");</script>
</body>
</html>
